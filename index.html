<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestSummariser.io</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <style>
            body{
                padding:0px;
                margin:0px;
                background-color: antiquewhite;
                font-family: Arial,sans-serif;
            }
            .card{
                margin: 0 auto;
                margin-top: 10%;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0px 0px 10px gray;
            }

            .card-title{
                text-align: center;
                font-weight: bold;
                margin-bottom: 20px;
            }
            .btn-text{
                width: 100%;
                background-color: #4CAF50;
                color: white;
                padding: 10px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                margin-top: 10px;
            }
            .summary-output{
                margin-top: 20px;
                padding: 15px;
                background-color:whitesmoke;
                color:black;
                border-radius: 5px;
                font-family:'Times New Roman', Times, serif;
            }
            #summary-heading{
                font-weight: bold;
                margin-bottom: 0px;
                margin-top:0px;
                text-align: center;
                color:black
                
            }
        </style>
</head>
<body>
   <div class="card" style="max-width:620px;">
  <div class="card-body">
   <h4 class="card-title">Text Summarizer</h4>

<form  id="summarization-form">
  <div class="input-group">
    <textarea class="form-control" id="dialogue-input" aria-label="With textarea" placeholder="Enter the content...." name="dialogue" required></textarea>
  </div>
  
<button type="submit" class="theme-success btn-text" id="myBtn" mt-5>
  Summarize
</button>
</form>
  </div>

  <div class="summary-output">
    <h3 id="summary-heading">Content Summary</h3>
    <p id="summary-text"></p>
  </div>
</div>

<script>
  // const button = document.getElementById("myBtn");

  // button.addEventListener("click", function() {
  //   alert("Button was clicked!");
  // });

  document.getElementById("summarization-form").addEventListener("submit", async function(event) {
    event.preventDefault();

    // get references to elements
    const dialogueInput = document.getElementById("dialogue-input");
    const summaryText = document.getElementById("summary-text");
    const submitButton = document.getElementById("myBtn");

    const dialogue = dialogueInput.value.trim();
    if (!dialogue) return ;

    // show preprocessing message and disable button
    summaryText.textContent = "Preprocessing ...";
    submitButton.disabled = true;


    try {
      // send the dialogue to the backend
      const response = await fetch("/summarize/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ dialogue:dialogue })
      });

      if (!response.ok) {
        throw new Error(`Network response was not ok: ${response.status}`);
      }

      const data = await response.json();
      summaryText.innerText = data.summary||"No summary returned";
    } catch (error) {
      // show any error messages in the summary text area
      
      summaryText.innerText = `Error: ${error.message}`;
    
    } finally {
      // re-enable the button
      submitButton.disabled = false;
    }
  });
</script>

</body>
</html>
